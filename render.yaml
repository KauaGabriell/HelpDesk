services:
  - type: web
    name: helpdesk-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    initialDeployHook: npx prisma db seed
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: helpdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://help-desk-lovat.vercel.app,http://localhost:5173,http://localhost:5174

databases:
  - name: helpdesk-db
    plan: free
    databaseName: helpdeskdb
    postgresMajorVersion: "18"
